<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAP VETO // CS2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#07090d;
    --panel:#11151d;
    --panel2:#171d28;
    --border:#262e3d;
    --accent:#ff5f1f;
    --accent2:#ffb020;
    --ct:#5b9bd5;
    --t:#e0a83c;
    --ban:#e14b4b;
    --text:#eef1f6;
    --muted:#7c8494;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter', Arial, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,95,31,.10), transparent 60%),
      radial-gradient(circle at 50% 100%, #10141c 0%, #06070a 75%);
    color:var(--text);
    min-height:100vh;
    padding:30px 14px 70px;
  }
  h1.title{
    text-align:center;
    font-family:'Rajdhani',sans-serif;
    font-weight:700;
    font-size:34px;
    letter-spacing:6px;
    margin:0 0 2px;
    color:#fff;
  }
  h1.title span{color:var(--accent);}
  .subtitle{
    text-align:center;
    color:var(--muted);
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:30px;
  }
  .wrap{max-width:960px;margin:0 auto;}
  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 14px 34px rgba(0,0,0,.45);
  }
  .step-label{
    font-family:'Rajdhani',sans-serif;
    font-size:13px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    margin-bottom:16px;
  }

  /* setup */
  .teams-setup{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;}
  .team-box{
    flex:1 1 260px;
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    text-align:center;
  }
  .team-box h3{
    margin:0 0 14px;color:var(--accent2);
    font-family:'Rajdhani',sans-serif;
    font-weight:600;
    font-size:14px;letter-spacing:2px;text-transform:uppercase;
  }
  .icon-upload{
    width:88px;height:88px;
    border-radius:50%;
    border:2px dashed var(--border);
    margin:0 auto 14px;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;cursor:pointer;background:#0c0f16;position:relative;
    transition:border-color .15s ease;
  }
  .icon-upload:hover{border-color:var(--accent);}
  .icon-upload img{width:100%;height:100%;object-fit:cover;}
  .icon-upload .plus{font-size:28px;color:var(--muted);}
  .icon-upload input{display:none;}
  input[type="text"].team-name{
    width:100%;padding:11px 12px;border-radius:9px;
    border:1px solid var(--border);background:#0c0f16;color:var(--text);
    font-family:'Inter',sans-serif;font-size:14px;text-align:center;outline:none;
  }
  input[type="text"].team-name:focus{border-color:var(--accent);}
  .vs-mark{
    display:flex;align-items:center;justify-content:center;
    font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;color:var(--muted);padding:0 6px;
  }
  .btn{
    display:inline-block;padding:13px 28px;border-radius:9px;border:none;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#180d02;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;
    letter-spacing:1.5px;cursor:pointer;text-transform:uppercase;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(255,95,31,.3);}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
  .row-actions{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;}

  /* coin flip */
  #coinStage{display:none;text-align:center;}
  .coin{
    width:118px;height:118px;margin:8px auto 20px;border-radius:50%;
    background:linear-gradient(145deg,#ffd45e,#c88a12);
    display:flex;align-items:center;justify-content:center;
    font-family:'Rajdhani',sans-serif;font-size:38px;font-weight:700;color:#3a2600;
    box-shadow:0 0 0 6px #7a5108 inset, 0 12px 28px rgba(0,0,0,.5);
  }
  .coin.flipping{animation:flip 1.1s ease-in-out;}
  @keyframes flip{0%{transform:rotateY(0);}100%{transform:rotateY(1440deg);}}
  #coinResultText{font-size:15px;color:var(--muted);min-height:20px;}

  /* veto */
  #vetoStage{display:none;}
  .turn-banner{
    text-align:center;padding:14px 16px;border-radius:12px;
    background:var(--panel2);border:1px solid var(--border);margin-bottom:20px;font-size:15px;
  }
  .turn-banner b{color:var(--accent2);}
  .turn-banner .tag{
    display:inline-block;padding:4px 11px;border-radius:6px;
    font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;
    margin-left:8px;text-transform:uppercase;
  }
  .tag.ban{background:rgba(225,75,75,.18);color:var(--ban);}
  .tag.pick{background:rgba(255,95,31,.18);color:var(--accent);}

  .maps-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px;
  }
  .map-card{
    position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);
    cursor:pointer;aspect-ratio:4/5;
    transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    background:#0c0f16;
  }
  .map-card:hover:not(.disabled){transform:translateY(-4px);box-shadow:0 10px 22px rgba(0,0,0,.5);border-color:var(--accent);}

  .map-media{position:absolute;inset:0;overflow:hidden;}
  .map-bg{
    position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;
    filter:blur(16px) brightness(.55) saturate(1.15);transform:scale(1.05);
  }
  .map-fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;}
  .map-scrim{
    position:absolute;left:0;right:0;bottom:0;height:52%;z-index:2;
    background:linear-gradient(to top, rgba(3,4,6,.92), rgba(3,4,6,0));
  }
  .map-name{
    position:absolute;left:0;right:0;bottom:8px;z-index:3;text-align:center;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;letter-spacing:1px;
    text-shadow:0 1px 4px rgba(0,0,0,.7);color:#fff;
  }
  .map-card .stamp{
    position:absolute;inset:8px;z-index:4;
    display:flex;align-items:center;justify-content:center;
    font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;
    background:rgba(4,5,8,.78);text-transform:uppercase;border-radius:8px;
  }
  .map-card.disabled{cursor:default;}
  .map-card.disabled .map-bg,.map-card.disabled .map-fg{filter:grayscale(75%) brightness(.4);}
  .map-card.stamp-ban .stamp{color:var(--ban);border:2px solid var(--ban);}
  .map-card.stamp-pick1 .stamp,.map-card.stamp-pick2 .stamp{color:var(--accent);border:2px solid var(--accent);}
  .map-card.stamp-decider .stamp{color:var(--accent2);border:2px solid var(--accent2);}

  .mini-media{
    position:relative;width:34px;height:34px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#0c0f16;
  }
  .mini-media .map-bg{filter:blur(6px) brightness(.6);inset:-15%;width:130%;height:130%;}
  .mini-media .map-fg{object-fit:cover;}

  /* side modal */
  #sideModal{
    display:none;position:fixed;inset:0;background:rgba(3,4,7,.82);
    align-items:center;justify-content:center;z-index:50;
  }
  .side-box{
    background:var(--panel);border:1px solid var(--border);border-radius:16px;
    padding:30px;text-align:center;max-width:380px;
  }
  .side-box h3{
    margin-top:0;color:var(--accent2);font-family:'Rajdhani',sans-serif;
    font-weight:600;font-size:17px;letter-spacing:.5px;
  }
  .side-choices{display:flex;gap:14px;justify-content:center;margin-top:20px;}
  .side-choice{
    flex:1;padding:16px 10px;border-radius:12px;border:1px solid var(--border);
    background:var(--panel2);cursor:pointer;transition:border-color .12s ease, transform .12s ease;
  }
  .side-choice:hover{border-color:var(--accent);transform:translateY(-2px);}
  .side-choice img.patch{width:46px;height:46px;object-fit:contain;display:block;margin:0 auto 8px;}
  .side-choice .slabel{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1.5px;}
  .side-choice.ct .slabel{color:var(--ct);}
  .side-choice.t .slabel{color:var(--t);}

  /* log */
  .veto-log{margin-top:20px;display:flex;flex-direction:column;gap:8px;}
  .log-row{
    display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;
    background:var(--panel2);border:1px solid var(--border);font-size:13px;
  }
  .log-row .badge{
    width:66px;flex-shrink:0;text-align:center;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.5px;
    padding:4px 0;border-radius:6px;text-transform:uppercase;
  }
  .badge.ban{background:rgba(225,75,75,.18);color:var(--ban);}
  .badge.pick{background:rgba(255,95,31,.18);color:var(--accent);}
  .badge.decider{background:rgba(255,176,32,.2);color:var(--accent2);}
  .log-row .mname{font-weight:600;flex:1;}
  .log-row .who{color:var(--muted);}
  .side-pill{
    display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:20px;
    font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:.5px;
  }
  .side-pill img{width:18px;height:18px;object-fit:contain;}
  .side-pill.ct{background:rgba(91,155,213,.16);color:var(--ct);}
  .side-pill.t{background:rgba(224,168,60,.16);color:var(--t);}

  /* result stage */
  #resultStage{display:none;}
  #summaryCard{
    background:linear-gradient(165deg,#12161f,#08090d);
    border:1px solid var(--border);border-radius:18px;padding:28px;
  }
  .summary-title{
    text-align:center;color:var(--muted);font-family:'Rajdhani',sans-serif;
    font-size:12px;letter-spacing:4px;text-transform:uppercase;margin-bottom:16px;
  }
  .summary-head{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:24px;}
  .summary-team{display:flex;flex-direction:column;align-items:center;gap:8px;width:140px;}
  .summary-team img.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;border:2px solid var(--border);}
  .summary-team .noicon{
    width:58px;height:58px;border-radius:50%;background:#1c2330;display:flex;align-items:center;
    justify-content:center;font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;border:2px solid var(--border);
  }
  .summary-team .sname{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:15px;text-align:center;}
  .summary-vs{font-family:'Rajdhani',sans-serif;font-size:22px;color:var(--muted);font-weight:700;}

  .result-strip{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-bottom:20px;
  }
  .result-tile{
    position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);aspect-ratio:4/5;background:#0c0f16;
  }
  .result-tile .rtag{
    position:absolute;top:6px;left:6px;right:6px;z-index:4;text-align:center;
    font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;
    padding:3px 0;border-radius:6px;text-transform:uppercase;
  }
  .rtag.ban{background:rgba(225,75,75,.85);color:#fff;}
  .rtag.pick{background:rgba(255,95,31,.9);color:#180d02;}
  .rtag.decider{background:rgba(255,176,32,.9);color:#180d02;}
  .result-tile .rname{
    position:absolute;left:0;right:0;bottom:22px;z-index:3;text-align:center;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .result-tile .rside{
    position:absolute;left:0;right:0;bottom:4px;z-index:3;text-align:center;
    display:flex;align-items:center;justify-content:center;gap:4px;
    font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--muted);
  }
  .result-tile .rside img{width:14px;height:14px;object-fit:contain;}
  .result-tile.dim .map-bg,.result-tile.dim .map-fg{filter:grayscale(70%) brightness(.45);}

  .veto-textlog{display:flex;flex-direction:column;gap:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">MAP<span> VETO</span></h1>
  <div class="subtitle">CS2 &middot; 16.09.2026</div>

  <!-- SETUP -->
  <div class="card" id="setupStage">
    <div class="step-label">Шаг 1 &middot; Команды</div>
    <div class="teams-setup">
      <div class="team-box">
        <h3>Команда 1 &middot; Орёл</h3>
        <label class="icon-upload" id="iconLabel1">
          <img id="iconImg1" style="display:none;">
          <span class="plus" id="iconPlus1">+</span>
          <input type="file" accept="image/*" id="iconInput1">
        </label>
        <input type="text" class="team-name" id="teamName1" placeholder="Название команды" maxlength="24">
      </div>
      <div class="vs-mark">VS</div>
      <div class="team-box">
        <h3>Команда 2 &middot; Решка</h3>
        <label class="icon-upload" id="iconLabel2">
          <img id="iconImg2" style="display:none;">
          <span class="plus" id="iconPlus2">+</span>
          <input type="file" accept="image/*" id="iconInput2">
        </label>
        <input type="text" class="team-name" id="teamName2" placeholder="Название команды" maxlength="24">
      </div>
    </div>
    <div class="row-actions">
      <button class="btn" id="toCoinBtn">Подбросить монету</button>
    </div>
  </div>

  <!-- COIN -->
  <div class="card" id="coinStage">
    <div class="step-label">Шаг 2 &middot; Жеребьёвка</div>
    <div style="text-align:center;">
      <div class="coin" id="coinEl">?</div>
      <div id="coinResultText"></div>
      <div class="row-actions">
        <button class="btn" id="flipBtn">Подбросить</button>
        <button class="btn secondary" id="startVetoBtn" style="display:none;">Начать вето</button>
      </div>
    </div>
  </div>

  <!-- VETO -->
  <div class="card" id="vetoStage">
    <div class="step-label">Шаг 3 &middot; Вето карт</div>
    <div class="turn-banner" id="turnBanner"></div>
    <div class="maps-grid" id="mapsGrid"></div>
    <div class="veto-log" id="vetoLog"></div>
    <div class="row-actions" id="saveRow" style="display:none;">
      <button class="btn" id="savePickBtn">Сохранить пик</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="card" id="resultStage">
    <div id="summaryCard">
      <div class="summary-title">Результат веты</div>
      <div class="summary-head" id="summaryHead"></div>
      <div class="result-strip" id="resultStrip"></div>
      <div class="veto-textlog" id="summaryLog"></div>
    </div>
    <div class="row-actions">
      <button class="btn" id="saveImgBtn">Сохранить картинку</button>
      <button class="btn secondary" id="resetBtn">Начать заново</button>
    </div>
  </div>
</div>

<!-- side pick modal -->
<div id="sideModal">
  <div class="side-box">
    <h3 id="sideModalTitle">Выберите сторону</h3>
    <div class="side-choices">
      <div class="side-choice ct" data-side="CT"><img class="patch" src="Ct_patch.png.webp"><div class="slabel">CT</div></div>
      <div class="side-choice t" data-side="T"><img class="patch" src="T_patch.png.webp"><div class="slabel">T</div></div>
    </div>
  </div>
</div>

<script>
// Local image files placed next to this index.html
const MAP_IMAGES = {
  dust2:   'Без названия 165_20260916120654.png',
  mirage:  'Без названия165_20260916120421.png',
  nuke:    'Без названия165_20260916120050.png',
  anubis:  'Без названия165_20260916115955.png',
  cache:   'Без названия165_20260916120522.png',
  ancient: 'Без названия165_20260916120606.png',
};
const SIDE_IMAGES = { CT:'Ct_patch.png.webp', T:'T_patch.png.webp' };

const MAPS = [
  {id:'dust2',   name:'Dust II'},
  {id:'mirage',  name:'Mirage'},
  {id:'inferno', name:'Inferno'},
  {id:'nuke',    name:'Nuke'},
  {id:'cache',   name:'Cache'},
  {id:'ancient', name:'Ancient'},
  {id:'anubis',  name:'Anubis'},
];

let teams = {
  1:{name:'Команда 1', icon:null},
  2:{name:'Команда 2', icon:null}
};
let firstTeam = 1;
let mapState = {};
let log = [];
let stepIndex = 0;

const steps = [
  {type:'ban',  team:'first'},
  {type:'ban',  team:'second'},
  {type:'pick', team:'first',  sideBy:'second'},
  {type:'pick', team:'second', sideBy:'first'},
  {type:'ban',  team:'first'},
  {type:'ban',  team:'second'},
];

function otherTeam(n){ return n===1?2:1; }
function teamNumFor(role){ return role==='first' ? firstTeam : otherTeam(firstTeam); }

// Builds a "poster" style media block: blurred zoomed copy behind + sharp contained image on top.
// If a map has no local image on file (e.g. Inferno), falls back to a plain colour tile.
function buildMapMedia(mapId, mini){
  const wrap = document.createElement('div');
  wrap.className = mini ? 'mini-media' : 'map-media';
  const src = MAP_IMAGES[mapId];
  if(src){
    const bg = document.createElement('img');
    bg.className = 'map-bg';
    bg.src = src;
    bg.alt = '';
    const fg = document.createElement('img');
    fg.className = 'map-fg';
    fg.src = src;
    fg.alt = mapId;
    wrap.appendChild(bg);
    wrap.appendChild(fg);
  } else {
    wrap.style.background = 'linear-gradient(160deg,#3a4152,#171b24)';
  }
  return wrap;
}

// ---------- icon upload ----------
function setupIconUpload(inputId, imgId, plusId, teamKey){
  const input = document.getElementById(inputId);
  const img = document.getElementById(imgId);
  const plus = document.getElementById(plusId);
  input.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      teams[teamKey].icon = ev.target.result;
      img.src = ev.target.result;
      img.style.display = 'block';
      plus.style.display = 'none';
    };
    reader.readAsDataURL(file);
  });
}
setupIconUpload('iconInput1','iconImg1','iconPlus1',1);
setupIconUpload('iconInput2','iconImg2','iconPlus2',2);

document.getElementById('toCoinBtn').addEventListener('click', ()=>{
  const n1 = document.getElementById('teamName1').value.trim();
  const n2 = document.getElementById('teamName2').value.trim();
  teams[1].name = n1 || 'Команда 1';
  teams[2].name = n2 || 'Команда 2';
  document.getElementById('setupStage').style.display='none';
  document.getElementById('coinStage').style.display='block';
});

// ---------- coin flip ----------
document.getElementById('flipBtn').addEventListener('click', ()=>{
  const coin = document.getElementById('coinEl');
  const btn = document.getElementById('flipBtn');
  btn.disabled = true;
  coin.classList.remove('flipping');
  void coin.offsetWidth;
  coin.classList.add('flipping');
  const heads = Math.random() < 0.5;
  setTimeout(()=>{
    coin.textContent = heads ? 'О' : 'Р';
    firstTeam = heads ? 1 : 2;
    const teamName = teams[firstTeam].name;
    const side = heads ? 'Орёл' : 'Решка';
    document.getElementById('coinResultText').innerHTML =
      'Выпал(а) <b style="color:var(--accent2)">'+side+'</b> — первой действует <b style="color:var(--accent2)">'+teamName+'</b>';
    document.getElementById('startVetoBtn').style.display='inline-block';
    btn.style.display='none';
  }, 1100);
});

document.getElementById('startVetoBtn').addEventListener('click', ()=>{
  document.getElementById('coinStage').style.display='none';
  document.getElementById('vetoStage').style.display='block';
  MAPS.forEach(m=> mapState[m.id]='available');
  renderMapsGrid();
  updateTurnBanner();
});

// ---------- veto grid ----------
function renderMapsGrid(){
  const grid = document.getElementById('mapsGrid');
  grid.innerHTML = '';
  MAPS.forEach(m=>{
    const st = mapState[m.id];
    const div = document.createElement('div');
    div.className = 'map-card';
    if(st !== 'available') div.classList.add('disabled');
    if(st === 'banned') div.classList.add('stamp-ban');
    if(st === 'pick1' || st === 'pick2'
